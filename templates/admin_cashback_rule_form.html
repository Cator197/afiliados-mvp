<!DOCTYPE html><html lang='pt-BR'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Regra de Cashback</title><link rel='stylesheet' href='{{ url_for("static", filename="css/style.css") }}'></head><body><div class='container' style='max-width:900px;'><h1>{{ 'Editar' if rule else 'Nova' }} regra de cashback</h1><p class='subtitle'>O cashback oficial continua dependendo da confirmação administrativa da compra.</p>{% if erro %}<div class='message-box' style='background:#fff3f3;'>{{ erro }}</div>{% endif %}<form method='POST'><input type='hidden' name='csrf_token' value='{{ csrf_token }}'><label>Platform</label><input name='platform' required value='{{ rule.platform if rule else "mercadolivre" }}'><label>Nome</label><input name='name' required value='{{ rule.name if rule else "" }}'><label>Match type</label><select name='match_type'><option value='default' {% if rule and rule.match_type=='default' %}selected{% endif %}>default</option><option value='path_contains' {% if rule and rule.match_type=='path_contains' %}selected{% endif %}>path_contains</option><option value='category_hint_contains' {% if rule and rule.match_type=='category_hint_contains' %}selected{% endif %}>category_hint_contains</option></select><label>Match value</label><input name='match_value' value='{{ rule.match_value if rule else "" }}'><label>Cashback %</label><input name='cashback_percent' type='number' min='0' max='20' step='0.01' required value='{{ rule.cashback_percent if rule else "3" }}'><label>Priority</label><input name='priority' type='number' required value='{{ rule.priority if rule else "100" }}'><label>Ativa</label><input name='active' type='checkbox' value='1' {% if not rule or rule.active %}checked{% endif %}><label>Notas</label><textarea name='notes'>{{ rule.notes if rule else '' }}</textarea><div class='actions'><button type='submit'>Salvar</button><a class='btn' href='{{ url_for("admin_cashback_rules") }}'>Voltar</a></div></form></div></body></html>
