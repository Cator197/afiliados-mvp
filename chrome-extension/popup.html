<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinhaOferta Cashback</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="mo-popup-body">
    <main class="mo-popup">
      <header class="mo-popup-header">
        <div class="mo-popup-title-area">
          <h1 class="mo-title">MinhaOferta</h1>
          <p class="mo-subtitle">Cashback no Mercado Livre</p>
        </div>
        <div class="mo-popup-actions" aria-label="Atalhos do popup">
          <button
            id="header-history-btn"
            class="mo-popup-action-button"
            type="button"
            title="Abrir histórico"
            aria-label="Abrir histórico"
          >
            Histórico
          </button>
          <button
            id="header-site-btn"
            class="mo-popup-action-button"
            type="button"
            title="Abrir MinhaOferta"
            aria-label="Abrir MinhaOferta"
          >
            Site
          </button>
        </div>
      </header>

      <section id="popup-status-box" class="mo-status-box status-neutral">
        <p id="status-text" class="mo-status">Verificando página atual...</p>
        <p id="status-details" class="mo-status-details"></p>
        <p id="status-note" class="mo-status-note"></p>
        <div id="popup-loading" class="mo-loading" hidden><span class="mo-spinner" aria-hidden="true"></span><span class="mo-loading-label">Processando</span></div>
        <p id="current-url" class="mo-url"></p>
      </section>

      <div class="mo-actions">
        <button id="simulate-btn" class="mo-btn mo-btn-primary" type="button" hidden>Gerar link com cashback</button>
                <button id="open-link-btn" class="mo-btn mo-btn-secondary" type="button" hidden>Abrir link</button>
                <button id="open-site-btn" class="mo-btn mo-btn-secondary" type="button" hidden>Entrar</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
