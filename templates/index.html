<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container container-sm">
        <h1>Acesse suas promoções com cashback</h1>
        <p class="subtitle">
            Para entrar, use o <strong>ID de usuário</strong> que você recebeu e sua senha.
            Se ainda não tem acesso, solicite o cadastro abaixo.
        </p>

        <div class="input-group">
            <label for="codigo_usuario">ID do usuário recebido</label>
            <input type="text" id="codigo_usuario" placeholder="Ex: CAIO001" autocomplete="username">
        </div>

        <div class="input-group">
            <label for="senha">Senha de acesso</label>
            <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">
        </div>

        <div class="actions">
            <button id="btnEntrar" type="button">Entrar</button>
            <a href="{{ url_for('pagina_solicitar_cadastro') }}" class="btn btn-secondary">Solicitar cadastro</a>
            <a href="{{ url_for('pagina_esqueci_senha') }}" class="btn btn-secondary">Esqueci minha senha</a>
        </div>

        <div id="mensagem" class="message-box alert alert-info" role="status" aria-live="polite">Informe seu ID e senha para entrar.</div>
    </div>

    <script>
        const btnEntrar = document.getElementById("btnEntrar");
        const inputCodigo = document.getElementById("codigo_usuario");
        const inputSenha = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");

        function mostrarMensagem(texto, tipo = "info") {
            mensagem.className = `message-box alert alert-${tipo}`;
            mensagem.textContent = texto;
            mensagem.setAttribute("role", tipo === "error" ? "alert" : "status");
            mensagem.setAttribute("aria-live", tipo === "error" ? "assertive" : "polite");
        }

        function mensagemLoginAmigavel(erro) {
            const texto = (erro || "").toLowerCase();

            if (texto.includes("não encontrado") || texto.includes("nao encontrado") || texto.includes("não existe") || texto.includes("nao existe")) {
                return "Não encontramos esse ID de usuário. Próximo passo: confira o ID e tente novamente.";
            }
            if (texto.includes("senha") && (texto.includes("inválida") || texto.includes("invalida") || texto.includes("incorreta"))) {
                return "Senha inválida. Próximo passo: revise sua senha e tente novamente.";
            }
            if (texto.includes("bloqueado") || texto.includes("inativo")) {
                return "Seu acesso está indisponível no momento. Próximo passo: fale com o suporte.";
            }

            return erro || "Não foi possível fazer login agora. Próximo passo: revise os dados e tente novamente.";
        }

        function obterCodigoUsuario() {
            const codigo_usuario = inputCodigo.value.trim().toUpperCase();
            if (!codigo_usuario) {
                mostrarMensagem("Informe o ID de usuário para continuar.", "warning");
                return null;
            }
            return codigo_usuario;
        }

        btnEntrar.addEventListener("click", async () => {
            const codigo_usuario = obterCodigoUsuario();
            if (!codigo_usuario) return;

            const senha = inputSenha.value;
            if (!senha) {
                mostrarMensagem("Digite sua senha para continuar.", "warning");
                return;
            }

            btnEntrar.disabled = true;
            btnEntrar.textContent = "Validando acesso...";
            mostrarMensagem("Validando seu acesso. Aguarde...", "loading");

            try {
                const resp = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ codigo_usuario, senha })
                });

                const data = await resp.json();

                if (data.ok) {
                    mostrarMensagem("Login realizado. Redirecionando...", "success");
                    window.location.href = data.redirect_to || `/usuario/${encodeURIComponent(codigo_usuario)}`;
                } else {
                    mostrarMensagem(mensagemLoginAmigavel(data.erro), "error");
                }
            } catch (e) {
                mostrarMensagem("Não foi possível se comunicar com o servidor. Tente novamente em instantes.", "error");
            } finally {
                btnEntrar.disabled = false;
                btnEntrar.textContent = "Entrar";
            }
        });

        inputSenha.addEventListener("keydown", function(event) {
            if (event.key === "Enter") btnEntrar.click();
        });

        inputCodigo.addEventListener("keydown", function(event) {
            if (event.key === "Enter") btnEntrar.click();
        });
    </script>
</body>
</html>
