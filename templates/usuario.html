<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar link</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Olá, {{ usuario.nome }}</h1>
        <p class="subtitle">
            Cole abaixo o link do produto do Mercado Livre para gerar seu link com cashback.
        </p>

        <div class="input-group">
            <label for="urlProduto">Link do produto</label>
            <input
                type="text"
                id="urlProduto"
                placeholder="Cole aqui a URL do produto do Mercado Livre"
            >
        </div>

        <div class="actions">
            <button id="btnGerar">Gerar link com cashback</button>
            <a class="btn" href="/historico/{{ usuario.codigo_usuario }}">Ver meu histórico</a>
            <a class="btn" href="/">Trocar de ID</a>
        </div>

        <div id="statusBox" class="status-box" style="display:none;"></div>
        <div id="resultBox" class="result-box" style="display:none;"></div>
    </div>

    <script>
        window.USUARIO = {
            id: {{ usuario.id }},
            codigo_usuario: "{{ usuario.codigo_usuario }}",
            nome: "{{ usuario.nome }}"
        };
    </script>
    <script src="{{ url_for('static', filename='js/usuario.js') }}"></script>
</body>
</html>
