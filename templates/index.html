<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Acesse suas promoções com cashback</h1>
        <p class="subtitle">
            Entre com seu código de usuário e senha.
        </p>

        <div class="input-group">
            <label for="codigo_usuario">Código do usuário</label>
            <input type="text" id="codigo_usuario" placeholder="Ex: CAIO001">
        </div>

        <div class="input-group">
            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">
        </div>

        <div class="actions">
            <button id="btnEntrar">Entrar</button>
            <a href="{{ url_for('pagina_solicitar_cadastro') }}" class="btn btn-secondary">Solicitar cadastro</a>
            <a href="{{ url_for('pagina_esqueci_senha') }}" class="btn btn-secondary">Esqueci minha senha</a>
        </div>

        <div id="mensagem" class="message-box" style="display:none;"></div>
    </div>

    <script>
        const btnEntrar = document.getElementById("btnEntrar");
        const inputCodigo = document.getElementById("codigo_usuario");
        const inputSenha = document.getElementById("senha");
        const mensagem = document.getElementById("mensagem");

        function mostrarMensagem(texto, erro = false) {
            mensagem.style.display = "block";
            mensagem.textContent = texto;
            mensagem.style.borderColor = erro ? "#f0b7b7" : "#e4e8ee";
            mensagem.style.background = erro ? "#fff3f3" : "#f7f8fa";
        }

        function obterCodigoUsuario() {
            const codigo_usuario = inputCodigo.value.trim().toUpperCase();
            if (!codigo_usuario) {
                mostrarMensagem("Digite seu código de usuário para continuar.", true);
                return null;
            }
            return codigo_usuario;
        }

        btnEntrar.addEventListener("click", async () => {
            const codigo_usuario = obterCodigoUsuario();
            if (!codigo_usuario) {
                return;
            }

            const senha = inputSenha.value;
            if (!senha) {
                mostrarMensagem("Digite sua senha para continuar.", true);
                return;
            }

            btnEntrar.disabled = true;
            mostrarMensagem("Validando acesso...");

            try {
                const resp = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ codigo_usuario, senha })
                });

                const data = await resp.json();

                if (data.ok) {
                    window.location.href = data.redirect_to || `/usuario/${encodeURIComponent(codigo_usuario)}`;
                } else {
                    mostrarMensagem(data.erro || "Não foi possível realizar o login.", true);
                }
            } catch (e) {
                mostrarMensagem("Erro de comunicação com o servidor.", true);
            } finally {
                btnEntrar.disabled = false;
            }
        });

        inputSenha.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                btnEntrar.click();
            }
        });

        inputCodigo.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                btnEntrar.click();
            }
        });
    </script>
</body>
</html>
