<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu histórico</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Histórico de {{ usuario.nome }}</h1>
        <p class="subtitle">
            Aqui você acompanha os links já gerados e o andamento do cashback. Os valores podem ficar pendentes até a confirmação da compra.
        </p>

        <div class="actions">
            <a class="btn" href="{{ url_for('pagina_usuario', codigo_usuario=usuario.codigo_usuario) }}">Gerar novo link</a>
            <a class="btn btn-secondary" href="{{ url_for('user_logout') }}">Sair</a>
        </div>

        <div id="mensagem" class="message-box alert alert-info" role="status" aria-live="polite">Carregando histórico...</div>

        <section class="history-summary" id="historySummary">
            <div class="summary-card">
                <span class="summary-label">Cashback pendente</span>
                <strong id="summaryQuantidadePendente">0</strong>
                <span class="summary-value" id="summaryValorPendente">R$ 0,00</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">Cashback pago</span>
                <strong id="summaryQuantidadePago">0</strong>
                <span class="summary-value" id="summaryValorPago">R$ 0,00</span>
            </div>
            <div class="summary-card">
                <span class="summary-label">Cash perdido</span>
                <strong id="summaryQuantidadePerdido">0</strong>
            </div>
        </section>

        <section id="historicoLista" class="history-list" aria-live="polite"></section>
    </div>

    <script>
        window.USUARIO = {
            id: {{ usuario.id }},
            codigo_usuario: "{{ usuario.codigo_usuario }}",
            nome: "{{ usuario.nome }}"
        };
    </script>

    <script>
        const historicoLista = document.getElementById("historicoLista");
        const mensagem = document.getElementById("mensagem");
        const summaryQuantidadePendente = document.getElementById("summaryQuantidadePendente");
        const summaryQuantidadePago = document.getElementById("summaryQuantidadePago");
        const summaryQuantidadePerdido = document.getElementById("summaryQuantidadePerdido");
        const summaryValorPendente = document.getElementById("summaryValorPendente");
        const summaryValorPago = document.getElementById("summaryValorPago");
        const PLACEHOLDER_IMAGE = "{{ url_for('static', filename='img/product-placeholder.svg') }}";

        function mostrarMensagem(texto, tipo = "info") {
            mensagem.className = `message-box alert alert-${tipo}`;
            mensagem.textContent = texto;
            mensagem.setAttribute("role", tipo === "error" ? "alert" : "status");
            mensagem.setAttribute("aria-live", tipo === "error" ? "assertive" : "polite");
        }

        function formatarMoeda(valor) {
            const numero = Number(valor || 0);
            return `R$ ${numero.toFixed(2).replace(".", ",")}`;
        }

        function atualizarResumo(summary) {
            const data = summary || {};
            summaryQuantidadePendente.textContent = `${Number(data.quantidade_pendente || 0)} pendentes`;
            summaryQuantidadePago.textContent = `${Number(data.quantidade_pago || 0)} pagos`;
            summaryQuantidadePerdido.textContent = `${Number(data.quantidade_perdido || 0)} perdidos`;
            summaryValorPendente.textContent = formatarMoeda(data.valor_pendente);
            summaryValorPago.textContent = formatarMoeda(data.valor_pago);
        }

        function valorMoedaOuTraco(valor) {
            if (valor === null || valor === undefined || valor === "") {
                return "-";
            }
            return formatarMoeda(valor);
        }

        function formatarData(dataTexto) {
            if (!dataTexto) return "-";
            const data = new Date(dataTexto);
            if (Number.isNaN(data.getTime())) return dataTexto;
            return data.toLocaleString("pt-BR", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function escapeHtml(value) {
            return String(value || "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        function cardLinkAfiliado(url) {
            if (!url) {
                return "-";
            }
            const sanitizedUrl = escapeHtml(url);
            return `<a href="${sanitizedUrl}" target="_blank" class="table-link">${sanitizedUrl}</a>`;
        }

        function renderHistorico(links) {
            historicoLista.innerHTML = links.map(link => {
                const descricao = (link.descricao_item || "").trim() || "Produto em processamento";
                const fotoUrl = (link.foto_item_url || "").trim() || PLACEHOLDER_IMAGE;
                const cashbackClass = Number(link.valor_cashback || 0) > 0 ? "cashback-highlight" : "";

                return `
                    <article class="history-card">
                        <img
                            class="history-card-image"
                            src="${escapeHtml(fotoUrl)}"
                            alt="Imagem do produto"
                            loading="lazy"
                            onerror="this.onerror=null;this.src='${PLACEHOLDER_IMAGE}';"
                        >
                        <p class="history-card-desc">${escapeHtml(descricao)}</p>
                        <p><strong>Status:</strong> ${badgeHtml(link)}</p>
                        ${link.status_description ? `<p class="small">${escapeHtml(link.status_description)}</p>` : ""}
                        <p><strong>Valor do cashback:</strong> <span class="${cashbackClass}">${valorMoedaOuTraco(link.valor_cashback)}</span></p>
                        <p><strong>Link afiliado:</strong> ${cardLinkAfiliado(link.url_afiliado)}</p>
                        <p><strong>Data:</strong> ${formatarData(link.criado_em)}</p>
                    </article>
                `;
            }).join("");
        }

        async function carregarHistorico() {
            try {
                const codigoUsuario = encodeURIComponent(window.USUARIO.codigo_usuario);
                const historicoUrl = `{{ url_for('listar_links_usuario', codigo_usuario='__CODIGO_USUARIO__') }}`.replace("__CODIGO_USUARIO__", codigoUsuario);
                const resumoUrl = `{{ url_for('resumo_links_usuario', codigo_usuario='__CODIGO_USUARIO__') }}`.replace("__CODIGO_USUARIO__", codigoUsuario);

                const [respHistorico, respResumo] = await Promise.all([
                    fetch(historicoUrl),
                    fetch(resumoUrl)
                ]);

                const data = await respHistorico.json();
                const resumoData = await respResumo.json();

                if (!data.ok || !resumoData.ok) {
                    mostrarMensagem(data.erro || resumoData.erro || "Erro ao carregar histórico.", "error");
                    historicoLista.innerHTML = `<div class="empty-state"><strong>Não foi possível carregar os dados.</strong><p>Próximo passo: atualize a página ou tente novamente em instantes.</p></div>`;
                    return;
                }

                atualizarResumo(resumoData.summary);

                const links = data.links || [];

                if (!links.length) {
                    mostrarMensagem("Você ainda não gerou links. Próximo passo: volte para a tela anterior e gere seu primeiro link.", "warning");
                    historicoLista.innerHTML = `
                        <div class="empty-state">
                            <strong>Histórico vazio.</strong>
                            <p>Nenhum link foi gerado até agora.</p>
                            <p>Próximo passo: clique em <em>Gerar novo link</em> para começar.</p>
                        </div>
                    `;
                    return;
                }

                mostrarMensagem(`Histórico atualizado com ${links.length} registro(s).`, "success");
                renderHistorico(links);
            } catch (e) {
                mostrarMensagem("Erro de comunicação com o servidor.", "error");
                historicoLista.innerHTML = `<div class="empty-state"><strong>Erro ao carregar histórico.</strong><p>Próximo passo: atualize a página e tente novamente.</p></div>`;
            }
        }

        carregarHistorico();
    </script>
</body>
</html>
