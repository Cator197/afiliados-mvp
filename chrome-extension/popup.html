<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinhaOferta Cashback</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="mo-popup-body">
    <main class="mo-popup">
      <h1 class="mo-title">MinhaOferta</h1>
      <p class="mo-subtitle">Cashback no Mercado Livre</p>

      <section class="mo-status-box">
        <p id="status-text" class="mo-status">Verificando página atual...</p>
        <p id="current-url" class="mo-url"></p>
      </section>

      <div class="mo-actions">
        <button id="check-page-btn" class="mo-btn mo-btn-primary" type="button">Verificar página</button>
        <button id="open-site-btn" class="mo-btn mo-btn-secondary" type="button">Abrir MinhaOferta</button>
      </div>

      <footer class="mo-footer">Links com cashback gerados com segurança pelo MinhaOferta.</footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
